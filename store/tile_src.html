<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 440px; height: 280px; overflow: hidden;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(160deg, #12101f 0%, #191430 55%, #1c1038 100%);
    color: #e8e6f0; display: flex; flex-direction: column; justify-content: center; padding-left: 44px;
  }
  h1 { font-size: 40px; line-height: 1.08; font-weight: 800; letter-spacing: -0.5px; }
  h1 .accent { color: #8b5cf6; }
  .sub { font-size: 17px; color: #b9b4cc; margin-top: 14px; }
  .foot { position: absolute; bottom: 22px; font-size: 13px; color: #8d87a3; }
</style>
</head>
<body>
  <h1>Page to<br><span class="accent">Markdown</span></h1>
  <div class="sub">Any page → clean, LLM-ready Markdown</div>
  <div class="foot">Free · Open Source · No Cloud APIs</div>
</body>
</html>
